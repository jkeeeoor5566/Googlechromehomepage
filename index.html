<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新标签页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 壁纸容器 -->
  <div class="wallpaper" id="wallpaperContainer">
    <div class="wallpaper-image" id="wallpaperImage"></div>
    <video class="wallpaper-video" id="wallpaperVideo" autoplay loop muted playsinline preload="metadata" decoding="sync"></video>
  </div>
  
  <!-- 主内容 -->
  <div class="container">
    <!-- 搜索框 -->
    <div class="search-box">
      <div class="search-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="6" fill="#008373"/>
          <path d="M8 7L16.5 12.5V20.5L8 25V7Z" fill="white" opacity="0.9"/>
          <path d="M16.5 12.5L24 7V25L16.5 20.5V12.5Z" fill="#FFB900"/>
          <path d="M16.5 20.5L24 25L16.5 29V20.5Z" fill="#FFB900" opacity="0.6"/>
          <path d="M8 25L16.5 20.5V29L8 25Z" fill="white" opacity="0.7"/>
        </svg>
      </div>
      <input type="text" id="searchInput" placeholder="必应搜索...">
      <button id="searchBtn">搜索</button>
      <div id="searchTip"></div>
    </div>

    <!-- 标签容器 -->
    <div class="tabs-container">
      <div id="tabsList"></div>
    </div>
  </div>

  <!-- 右上角设置按钮（带下拉菜单） -->
  <div class="settings-wrapper">
    <button class="settings-btn" id="settingsBtn" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <div class="settings-dropdown" id="settingsDropdown">
      <button class="dropdown-item" data-action="addTab">➕ 自定义标签</button>
      <button class="dropdown-item" data-action="changeWallpaper">💽 更换壁纸</button>
      <button class="dropdown-item" data-action="exportUrls">📤 导出网址</button>
      <button class="dropdown-item" data-action="importUrls">📥 导入网址</button>
      <button class="dropdown-item" data-action="iconSettings">🎨 图标设置</button>
    </div>
  </div>

  <!-- 隐藏文件选择器 -->
  <input type="file" id="wallpaperFile" accept="image/*,video/mp4,video/webm,video/ogg" style="display:none;">
  <input type="file" id="importFile" accept=".html,text/html" style="display:none;">

  <!-- 添加标签弹窗 -->
  <div class="modal" id="addTabModal">
    <div class="modal-content">
      <h3>添加自定义标签</h3>
      <input type="text" id="tabName" placeholder="标签名称">
      <input type="url" id="tabUrl" placeholder="网页链接（http://开头）">
      <button id="confirmAddTab">确认添加</button>
      <button id="closeModal">取消</button>
    </div>
  </div>

  <!-- 导出确认弹窗 -->
  <div class="modal" id="exportConfirmModal">
    <div class="modal-content">
      <h3>📤 确认导出</h3>
      <p style="color:#cbd5e1; text-align:center; font-size:15px; line-height:1.6;">
        即将导出所有标签为 HTML 文件，<br>是否继续？
      </p>
      <div style="display:flex; gap:12px; margin-top:8px;">
        <button id="confirmExportBtn" style="flex:1; padding:12px; border:none; border-radius:12px; background:#2974c5; color:#fff; font-size:15px; font-weight:600; cursor:pointer;">确认导出</button>
        <button id="cancelExportBtn" style="flex:1; padding:12px; border:none; border-radius:12px; background:rgba(255,255,255,0.08); color:#cbd5e1; font-size:15px; font-weight:600; cursor:pointer;">取消</button>
      </div>
    </div>
  </div>

  <!-- 图标设置弹窗 -->
  <div class="modal" id="iconSettingsModal">
    <div class="modal-content" style="max-width:420px;">
      <h3>🎨 图标设置</h3>
      <div id="iconSettingList" style="
        max-height:320px; overflow-y:auto;
        display:flex; flex-direction:column; gap:12px;
        padding-right:4px;
      "></div>
      <button id="addIconRowBtn" style="
        padding:10px; border:1px dashed rgba(255,255,255,0.25);
        border-radius:12px; background:rgba(255,255,255,0.04);
        color:#94a3b8; font-size:20px; cursor:pointer;
        transition:background 0.2s;
      " onmouseover="this.style.background='rgba(255,255,255,0.10)'" onmouseout="this.style.background='rgba(255,255,255,0.04)'">
        +
      </button>
      <input type="file" id="iconFileInput" accept="image/*" style="display:none;">
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
